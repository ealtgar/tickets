databases:
  - name: tickets-db
    databaseName: tickets
    user: tickets
    plan: free

services:
  - type: web
    name: tickets-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      # Render entrega "postgresql://..."; app/database.py lo adapta a psycopg 3.
      - key: DATABASE_URL
        fromDatabase:
          name: tickets-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: "lax"
      - key: PYTHON_VERSION
        value: "3.13.5"
