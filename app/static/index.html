<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickets</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <h1 class="brand">Tickets</h1>
      <p class="muted" id="auth-subtitle">Inicia sesión para continuar</p>

      <div class="oauth-buttons">
        <a class="btn-oauth btn-oauth-github" href="/api/auth/oauth/github/login">
          <svg class="oauth-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/>
          </svg>
          <span>Continuar con GitHub</span>
        </a>
        <a class="btn-oauth btn-oauth-google" href="/api/auth/oauth/google/login">
          <svg class="oauth-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Continuar con Google</span>
        </a>
      </div>
      <div class="divider"><span>o</span></div>

      <form id="login-form" class="form">
        <label>
          Usuario
          <input type="text" id="login-username" autocomplete="username" required />
        </label>
        <label>
          Contraseña
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
      </form>

      <form id="register-form" class="form hidden">
        <label>
          Usuario
          <input type="text" id="register-username" minlength="3" maxlength="50" autocomplete="username" required />
        </label>
        <label>
          Correo
          <input type="email" id="register-email" maxlength="255" autocomplete="email" required />
        </label>
        <label>
          Contraseña
          <input type="password" id="register-password" minlength="8" maxlength="128" autocomplete="new-password" required />
        </label>
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
      </form>

      <p class="muted center">
        <span id="toggle-text">¿No tienes cuenta?</span>
        <button type="button" id="toggle-auth" class="link">Regístrate</button>
      </p>
    </div>
  </div>

  <div id="app-view" class="app-view hidden">
    <header class="topbar">
      <span class="brand">Tickets</span>
      <div class="topbar-right">
        <span class="muted" id="current-user"></span>
        <button type="button" id="logout-btn" class="btn btn-ghost">Salir</button>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <input type="search" id="search" placeholder="Buscar por título o descripción..." />
        <select id="filter-status">
          <option value="">Todos los estados</option>
          <option value="open">Abierto</option>
          <option value="in_progress">En progreso</option>
          <option value="closed">Cerrado</option>
        </select>
        <select id="filter-priority">
          <option value="">Todas las prioridades</option>
          <option value="low">Baja</option>
          <option value="medium">Media</option>
          <option value="high">Alta</option>
        </select>
        <button type="button" id="new-ticket-btn" class="btn btn-primary">Nuevo ticket</button>
      </section>

      <section id="tickets" class="tickets"></section>

      <div class="pagination">
        <button type="button" id="prev-page" class="btn btn-ghost">Anterior</button>
        <span class="muted" id="page-info"></span>
        <button type="button" id="next-page" class="btn btn-ghost">Siguiente</button>
      </div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close="modal"></div>
    <div class="modal-panel">
      <button type="button" class="modal-close" data-close="modal">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
